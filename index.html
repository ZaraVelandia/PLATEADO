<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familia Plata · Mentores financieros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E9DA; --surface:#FFFBF4; --surface-2:#F6EEE1; --ink:#22352F; --ink-soft:#5B6B65;
  --green:#1F5C4A; --green-ink:#FFFFFF; --mustard:#F2B93B; --mustard-soft:#FBE7B5;
  --bubble-user:#E3EFDF; --bubble-bot:#F7EDE0; --line:#E6D9C5; --shadow:0 6px 24px rgba(60,40,10,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16211E; --surface:#1E2B27; --surface-2:#24332E; --ink:#EEE6D8; --ink-soft:#A9B5AF;
    --green:#3E9A7C; --green-ink:#0E1A16; --mustard:#F2B93B; --mustard-soft:#3A3220;
    --bubble-user:#27453A; --bubble-bot:#2B3833; --line:#33443E; --shadow:0 6px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16211E; --surface:#1E2B27; --surface-2:#24332E; --ink:#EEE6D8; --ink-soft:#A9B5AF;
  --green:#3E9A7C; --green-ink:#0E1A16; --mustard:#F2B93B; --mustard-soft:#3A3220;
  --bubble-user:#27453A; --bubble-bot:#2B3833; --line:#33443E; --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* Selector de mentores */
.picker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid transparent;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.pick svg{width:40px;height:40px;flex:none}
.pick b{display:block;font-weight:800;font-size:15px;line-height:1.1}
.pick small{display:block;color:var(--ink-soft);font-size:12.5px}
.pick[aria-selected="true"]{border-color:var(--green)}

.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;flex:1;min-height:0}
@media (max-width:860px){.stage{grid-template-columns:1fr}}

/* Presentación */
.intro{display:flex;flex-direction:column;gap:14px}
.hello{position:relative;background:var(--surface);border-radius:28px 28px 28px 8px;padding:20px 22px 18px;box-shadow:var(--shadow)}
.hello h1{font-family:"Caveat","Comic Sans MS",cursive;font-weight:700;color:var(--green);font-size:clamp(34px,5vw,48px);line-height:1;margin:0;transform:rotate(-3deg);transform-origin:left}
.hello p{margin:10px 0 0;color:var(--ink-soft);font-weight:700}
.hello .rule{display:block;width:72px;height:4px;border-radius:4px;background:var(--mustard);margin-top:10px}
.portrait{display:flex;justify-content:center}
.portrait svg{width:min(220px,55vw);height:auto}
@media (max-width:860px){.portrait{display:none}}
.traits{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
@media (max-width:860px){.traits{flex-direction:row;overflow-x:auto;scrollbar-width:none}.traits li{flex:0 0 220px}}
.traits li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:999px;padding:8px 16px 8px 8px;box-shadow:var(--shadow)}
.traits .ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--mustard);display:grid;place-items:center;color:#1F5C4A}
.traits .ic svg{width:22px;height:22px}
.traits b{display:block;color:var(--green);font-weight:800;line-height:1.2}
.traits span{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.3}

/* Chat */
.chat{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:560px;max-height:calc(100dvh - 120px);overflow:hidden}
@media (max-width:860px){.chat{min-height:70dvh;max-height:none}}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-head svg{width:44px;height:44px;flex:none}
.chat-head .who{flex:1;min-width:0}
.chat-head b{display:block;font-weight:800;font-size:17px}
.chat-head small{color:var(--ink-soft)}
.online{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green);background:var(--bubble-user);padding:4px 10px;border-radius:999px}
.online::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;color:var(--ink-soft)}
.icon-btn:hover{background:var(--surface-2)}

.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg svg{width:34px;height:34px;flex:none}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:10px 14px;border-radius:18px;background:var(--bubble-bot);font-size:15px;overflow-wrap:anywhere}
.msg.bot .bubble{border-bottom-left-radius:6px}
.msg.user .bubble{background:var(--bubble-user);border-bottom-right-radius:6px}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}
.bubble time{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-align:right}
.user-dot{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;flex:none}
.user-dot svg{width:20px;height:20px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
.notice{align-self:center;font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);padding:8px 14px;border-radius:12px;text-align:center;max-width:92%}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.quick button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 10px;text-align:left;font-size:13px;line-height:1.25;color:var(--ink)}
.quick button:hover{border-color:var(--green)}
.quick button:disabled{opacity:.5;cursor:default}
.quick svg{width:22px;height:22px;flex:none;color:var(--green)}
@media (max-width:480px){.quick{grid-template-columns:1fr}}

.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 16px}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit;font-size:15px;max-height:140px;line-height:1.4}
.composer textarea::placeholder{color:var(--ink-soft)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:var(--green-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5;cursor:default}
.send svg{width:20px;height:20px}
.foot{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0}
</style>
</head>
<body>
<div class="app">
  <nav class="picker" role="tablist" aria-label="Elige tu mentor" id="picker"></nav>
  <main class="stage">
    <section class="intro" aria-live="polite">
      <div class="hello">
        <h1 id="helloName"></h1>
        <span class="rule"></span>
        <p id="helloRole"></p>
      </div>
      <div class="portrait" id="portrait"></div>
      <ul class="traits" id="traits"></ul>
    </section>
    <section class="chat" aria-label="Conversación">
      <header class="chat-head">
        <span id="headAvatar"></span>
        <div class="who"><b id="headName"></b><small id="headRole"></small></div>
        <span class="online">En línea</span>
        <button class="icon-btn" id="resetBtn" title="Empezar una conversación nueva" aria-label="Empezar una conversación nueva">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </header>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="composer" id="composer" onsubmit="return false">
        <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" aria-label="Escribe tu mensaje"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
        </button>
      </form>
    </section>
  </main>
  <p class="foot">Orientación educativa: los mentores no reemplazan la asesoría de un profesional financiero.</p>
</div>

<script>
/* ---------- Íconos ---------- */
const ICONS = {
  chart:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="3.2"/><circle cx="5" cy="9" r="2.4"/><circle cx="19" cy="9" r="2.4"/><path d="M6 20c0-3.5 2.7-6 6-6s6 2.5 6 6zM1 19c0-2.6 1.7-4.4 4-4.6A7.5 7.5 0 0 0 4.2 19zM23 19c0-2.6-1.7-4.4-4-4.6a7.5 7.5 0 0 1 .8 4.6z"/></svg>',
  house:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5v-6h4v6h5v-9.5h3z"/></svg>',
  leaf:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4C11 4 5 8 5 15c0 1.3.3 2.5.8 3.5L3 21l1.4 1.4 2.8-2.8c1 .5 2.2.8 3.5.8C17.7 20.4 20 13 20 4zM9 16c1.8-3 4-5 7-6.5-2.5 2-4.5 4.2-5.8 7.3z"/></svg>',
  clipboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.5 14 2.5-2.5 2 2 3-3.5"/></svg>',
  coins:'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 9c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v3c0 1.5-3.1 2.8-7 2.8S5 13.5 5 12zM5 15c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v3c0 1.5-3.1 2.8-7 2.8S5 19.5 5 18z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
  piggy:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9.5V7l-2.4 1.2A7.5 7.5 0 0 0 12 6.5c-4.4 0-8 2.9-8 6.5 0 2 1.1 3.8 2.8 5V21h3v-2c.7.2 1.4.3 2.2.3s1.5-.1 2.2-.3v2h3v-3c1-.7 1.8-1.6 2.3-2.6H22v-4h-1.5a6 6 0 0 0-1.5-1.9zM16 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/><path d="M6 12h3l1.5-2.5L13 14l1.5-2H18"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2zM9 19h6v1.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>'
};

/* ---------- Avatares ilustrados ---------- */
function avatar(id){
  const skin = {bendito:'#F2C9A5', milagros:'#F3CBA8', clara:'#EBB991', lukas:'#E9B48C'}[id];
  const bgc  = {bendito:'#DCE8F2', milagros:'#F7E2C8', clara:'#E5EEDB', lukas:'#DDE7F4'}[id];
  const eyes = '<circle cx="26" cy="33" r="2.2" fill="#2B211C"/><circle cx="38" cy="33" r="2.2" fill="#2B211C"/><path d="M21.5 28.5q4.5-2.5 8 0M34.5 28.5q4.5-2.5 8 0" stroke="#5A4033" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  const cheeks = '<circle cx="22" cy="39" r="2.6" fill="#F29B8F" opacity=".45"/><circle cx="42" cy="39" r="2.6" fill="#F29B8F" opacity=".45"/>';
  const smile = '<path d="M27 41q5 4.5 10 0" stroke="#7A3B2E" stroke-width="2" fill="none" stroke-linecap="round"/>';
  let back='', hair='', body='', extra='';
  if(id==='bendito'){
    body='<path d="M10 64c2-11 10-15 22-15s20 4 22 15z" fill="#22385C"/><path d="M26 49l6 9 6-9z" fill="#BFD7EE"/>';
    hair='<path d="M17 30c-1-10 5-16 15-16s16 6 15 16c-2-6-5-9-8-9-3 2-10 2-14 0-4 0-6 3-8 9z" fill="#D9D9D9"/><path d="M16 31c0-3 1-5 2-6v9zM48 31c0-3-1-5-2-6v9z" fill="#CFCFCF"/>';
    extra='<path d="M24 40c3-2.5 5.5-2 8 0 2.5-2 5-2.5 8 0-2 2.5-5 2-8 .5-3 1.5-6 2-8-.5z" fill="#D2D2D2"/>';
  }
  if(id==='milagros'){
    back='<g fill="#B9B4B0"><circle cx="16" cy="28" r="7"/><circle cx="48" cy="28" r="7"/><circle cx="15" cy="38" r="6"/><circle cx="49" cy="38" r="6"/><circle cx="17" cy="46" r="5"/><circle cx="47" cy="46" r="5"/></g>';
    body='<path d="M10 64c2-11 10-15 22-15s20 4 22 15z" fill="#F4EBDD"/><path d="M24 50q8 5 16 0" stroke="#E4D6C2" stroke-width="2" fill="none"/>';
    hair='<g fill="#C8C3BF"><circle cx="22" cy="17" r="7"/><circle cx="32" cy="14" r="8"/><circle cx="42" cy="17" r="7"/><circle cx="17" cy="23" r="6"/><circle cx="47" cy="23" r="6"/></g>';
    extra='<circle cx="17.5" cy="42" r="2" fill="#E0A82E"/><circle cx="46.5" cy="42" r="2" fill="#E0A82E"/>';
  }
  if(id==='clara'){
    back='<path d="M13 30c0-12 8-18 19-18s19 6 19 18v24H13z" fill="#4A2A1C"/>';
    body='<path d="M10 64c2-11 10-15 22-15s20 4 22 15z" fill="#A9C8EA"/><path d="M27 49l5 7 5-7z" fill="#F2F7FC"/>';
    hair='<path d="M15 31c0-11 7-17 17-17s17 6 17 17c-5-2-10-7-12-11-4 6-13 10-22 11z" fill="#5B3424"/>';
    extra='<circle cx="17.5" cy="41" r="2" fill="#E0A82E"/><circle cx="46.5" cy="41" r="2" fill="#E0A82E"/>';
  }
  if(id==='lukas'){
    body='<path d="M10 64c2-11 10-15 22-15s20 4 22 15z" fill="#6E96CE"/><path d="M27 49l5 7 5-7z" fill="#DCE7F5"/>';
    hair='<path d="M16 30c-2-11 5-18 16-18 9 0 17 5 16 18-2-5-4-8-6-8 1-2 0-4-1-5-2 3-6 4-11 3-3 0-6 1-8 4-3 1-5 3-6 6z" fill="#3A2A20"/>';
    extra='<path d="M18 36c1 9 7 14 14 14s13-5 14-14c-1 3-3 5-5 5-2-2-5-3-9-3s-7 1-9 3c-2 0-4-2-5-5z" fill="#3A2A20" opacity=".9"/><path d="M27 43q5 3 10 0" stroke="#F2E2D6" stroke-width="2" fill="none" stroke-linecap="round"/>';
  }
  const face = `<path d="M32 15c-9 0-15 7-15 17 0 10 6.5 17 15 17s15-7 15-17c0-10-6-17-15-17z" fill="${skin}"/><ellipse cx="17" cy="34" rx="2.5" ry="3.5" fill="${skin}"/><ellipse cx="47" cy="34" rx="2.5" ry="3.5" fill="${skin}"/>`;
  const mouth = id==='lukas' ? '' : smile;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="c-${id}-${Math.random().toString(36).slice(2,7)}"><circle cx="32" cy="32" r="32"/></clipPath></defs><circle cx="32" cy="32" r="32" fill="${bgc}"/><g>${back}${body}${face}${hair}${eyes}${cheeks}${extra}${mouth}</g><circle cx="32" cy="32" r="30.5" fill="none" stroke="#FFFFFF" stroke-width="3"/></svg>`;
}

 lukas:{
    name:'Lukas Plata', age:32, role:'Mentor de Deudas', roleShort:'Tu mentor de Deudas',
    traits:[
      ['coins','Estrategia','Para que tus deudas no te detengan.'],
      ['leaf','Tranquilidad','Menos estrés, más libertad.'],
      ['people','Soluciones reales','Con herramientas prácticas y a tu ritmo.']
    ],
    quick:[
      ['doc','Descargar plantilla de deudas','Compárteme una plantilla sencilla para registrar todas mis deudas y organizarlas.'],
      ['chart','Estrategias para priorizar pagos','Explícame los métodos bola de nieve y avalancha para pagar deudas, con un ejemplo.'],
      ['bulb','Consejos para uso responsable de la tarjeta','Dame consejos para usar la tarjeta de crédito de forma responsable.']
    ]
  }
};

/* ---------- Estado ---------- */
const GREETING = 'Hola, ¿en qué puedo ayudarte hoy?';
const STORE_KEY = 'plata-chats-v1';
let current = 'bendito';
let busy = false;
let histories = {};
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const s = JSON.parse(raw); histories = s.histories||{}; if(MENTORS[s.current]) current = s.current; } }catch(e){}
  for(const id in MENTORS){ if(!Array.isArray(histories[id]) || !histories[id].length) histories[id] = [greet()]; }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({current, histories})); }catch(e){} }
function greet(){ return {role:'assistant', content:GREETING, t:Date.now()}; }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const fmtTime = t => new Date(t).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function richText(src){
  const lines = esc(src.trim()).split(/\n/);
  let html = '', list = null, para = [];
  const flushPara = () => { if(para.length){ html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const flushList = () => { if(list){ html += `<${list.tag}>` + list.items.map(i=>`<li>${i}</li>`).join('') + `</${list.tag}>`; list = null; } };
  for(const raw of lines){
    const line = raw.trim();
    const ul = line.match(/^[-•*]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if(ul || ol){
      flushPara(); const tag = ul ? 'ul' : 'ol';
      if(!list || list.tag !== tag){ flushList(); list = {tag, items:[]}; }
      list.items.push((ul||ol)[1]);
    } else if(!line){ flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

/* ---------- Render ---------- */
function renderPicker(){
  $('#picker').innerHTML = Object.entries(MENTORS).map(([id,m]) =>
    `<button class="pick" role="tab" aria-selected="${id===current}" data-id="${id}">${avatar(id)}<span><b>${m.name.split(' ')[0]}</b><small>${m.role.replace(/^Mentora? de /,'')}</small></span></button>`
  ).join('');
  $('#picker').querySelectorAll('.pick').forEach(b => b.onclick = () => select(b.dataset.id));
}
function renderIntro(){
  const m = MENTORS[current];
  $('#helloName').textContent = `Hola, soy ${m.name}`;
  $('#helloRole').textContent = `${m.age} años, ${m.role}`;
  $('#portrait').innerHTML = avatar(current);
  $('#traits').innerHTML = m.traits.map(([ic,t,d]) => `<li><span class="ic">${ICONS[ic]}</span><div><b>${t}</b><span>${d}</span></div></li>`).join('');
  $('#headAvatar').innerHTML = avatar(current);
  $('#headName').textContent = m.name;
  $('#headRole').textContent = m.roleShort;
  $('#quick').innerHTML = m.quick.map(([ic,label],i) => `<button type="button" data-i="${i}">${ICONS[ic]}<span>${label}</span></button>`).join('');
  $('#quick').querySelectorAll('button').forEach(b => b.onclick = () => send(m.quick[+b.dataset.i][2]));
  document.title = `${m.name} · ${m.role}`;
}
function msgHTML(msg){
  if(msg.role === 'notice') return `<div class="notice">${esc(msg.content)}</div>`;
  const isUser = msg.role === 'user';
  const who = isUser ? `<span class="user-dot">${ICONS.user}</span>` : avatar(current);
  const body = msg.pending ? '<span class="typing" aria-label="Escribiendo"><i></i><i></i><i></i></span>' : richText(msg.content);
  return `<div class="msg ${isUser?'user':'bot'}">${who}<div class="bubble">${body}${msg.pending?'':`<time>${fmtTime(msg.t)}</time>`}</div></div>`;
}
function renderLog(){
  const log = $('#log');
  log.innerHTML = histories[current].map(msgHTML).join('');
  log.scrollTop = log.scrollHeight;
}
function setBusy(v){
  busy = v;
  $('#sendBtn').disabled = v;
  $('#quick').querySelectorAll('button').forEach(b => b.disabled = v);
}
function select(id){
  if(busy || !MENTORS[id]) return;
  current = id; saveState();
  renderPicker(); renderIntro(); renderLog();
  if(location.hash.slice(1) !== id) history.replaceState(null,'','#'+id);
}

/* ---------- Conversación (vía tu servidor) ---------- */
const API_URL = '/api/chat';

function buildTurns(id){
  const convo = histories[id].filter(x => (x.role==='user'||x.role==='assistant') && !x.pending && x.content && x.content !== GREETING);
  let turns = convo.slice(-16).map(x => ({role:x.role, content:x.content}));
  while(turns.length && turns[0].role !== 'user') turns.shift();
  return turns;
}

async function send(text){
  text = (text||'').trim();
  if(!text || busy) return;
  const id = current;
  const h = histories[id];
  h.push({role:'user', content:text, t:Date.now()});
  const pending = {role:'assistant', content:'', pending:true, t:Date.now()};
  h.push(pending);
  setBusy(true); renderLog(); saveState();

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mentor:id, messages:buildTurns(id)})
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo obtener la respuesta. Vuelve a enviar tu mensaje.');
    pending.pending = false; pending.content = (data.reply||'').trim(); pending.t = Date.now();
  }catch(e){
    h.splice(h.indexOf(pending),1);
    h.push({role:'notice', content: e.message && !/fetch/i.test(e.message) ? e.message : 'No hay conexión con el servidor. Revisa tu internet y vuelve a intentarlo.'});
  }finally{
    setBusy(false); if(current===id) renderLog(); saveState();
  }
}

/* ---------- Eventos ---------- */
const input = $('#input');
function autoGrow(){ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,140)+'px'; }
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); } });
$('#composer').addEventListener('submit', submit);
function submit(){ if(busy) return; const v = input.value; input.value=''; autoGrow(); send(v); }
$('#resetBtn').onclick = () => { if(busy) return; histories[current] = [greet()]; saveState(); renderLog(); };
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(MENTORS[h] && h!==current) select(h); });

/* ---------- Inicio ---------- */
loadState();
const startHash = location.hash.slice(1);
if(MENTORS[startHash]) current = startHash;
renderPicker(); renderIntro(); renderLog();
</script>
</body>
